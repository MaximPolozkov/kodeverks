services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itstudio}
      POSTGRES_USER: ${POSTGRES_USER:-itstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itstudio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itstudio}:${POSTGRES_PASSWORD:-itstudio}@db:5432/${POSTGRES_DB:-itstudio}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["arq", "app.bot.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itstudio}:${POSTGRES_PASSWORD:-itstudio}@db:5432/${POSTGRES_DB:-itstudio}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
